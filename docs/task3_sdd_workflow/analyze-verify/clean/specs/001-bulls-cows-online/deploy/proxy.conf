# S3(E3 部署與網路)反向代理:對外只有這一個入口,後面是同一個 Node 行程(app:8080)
# 路徑照 contracts/game.asyncapi.yaml:WebSocket 入口是 /ws,其他路徑都是前端建置產物

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # WebSocket 訊息協定(E2)。伺服器每 15 秒送一次 ping(research R5),
    # 閒置逾時設成心跳的好幾倍,避免預設的 60 秒在網路抖動時切斷連線
    location = /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 前端建置產物(E1),由 Node 的 node:http 送出
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
